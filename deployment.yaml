apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-blue

spec:
  replicas: 3

  selector:
    matchLabels:
      app: food-portal
      version: blue

  template:
    metadata:
      labels:
        app: food-portal
        version: blue

    spec:
      containers:
        - name: food-portal
          image: 78619/food-ordering-portal:v1
          ports:
            - containerPort: 80

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-green

spec:
  replicas: 3

  selector:
    matchLabels:
      app: food-portal
      version: green

  template:
    metadata:
      labels:
        app: food-portal
        version: green

    spec:
      containers:
        - name: food-portal
          image: 78619/food-ordering-portal:v2
          ports:
            - containerPort: 80

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: food-ordering-service

spec:
  type: NodePort

  selector:
    app: food-portal
    version: blue

  ports:
    - port: 80
      targetPort: 80
      nodePort: 30014
